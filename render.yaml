services:
  - type: static
    name: truthguard-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://fakenewsdetection-s6dh.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: truthguard-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: truthguard-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: "https://fakenewsdetection-1-4iyd.onrender.com"
      - key: ENVIRONMENT
        value: "production"
      - key: MODEL_PATH
        value: "../models/bert_fake_news/"

databases:
  - name: truthguard-db
    databaseName: truthguard
    user: truthguard_user
    plan: free
